<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lineless 设备配网</title><style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#0a100f;color:#edf6ef}*{box-sizing:border-box}body{max-width:460px;margin:0 auto;padding:32px 20px}h1{font-size:30px;letter-spacing:-1px;margin:10px 0}.eyebrow{color:#b7f5b3;font-size:12px;letter-spacing:2px}p,small{color:#91a79b;line-height:1.7}.panel{background:#15221b;border:1px solid #293b33;border-radius:16px;padding:22px;margin-top:25px}label{display:block;font-size:12px;color:#b8cdbf;margin-top:17px}input,select,button{font:inherit;width:100%;padding:12px;border-radius:9px;margin-top:7px;border:1px solid #3b5141;background:#0c1511;color:#edf6ef}button{background:#b7f5b3;color:#142015;font-weight:650;cursor:pointer;border:0}button:disabled{opacity:.4}button.secondary{background:#263c2d;color:#b7f5b3}code{display:block;overflow-wrap:anywhere;color:#b7f5b3;font-size:15px;margin:8px 0}.muted{font-size:12px}#status{white-space:pre-wrap;font-size:12px;color:#eacb86}#claim{border-top:1px solid #293b33;margin-top:20px;padding-top:16px}[hidden]{display:none!important}</style></head><body>
<div class="eyebrow">LINELESS / SETUP</div><h1>连接你的电子名片</h1><p>让设备接入路由器或手机热点，再到无线管理网站认领。</p>
<div class="panel"><form id="setup"><label>附近的 Wi-Fi<select id="networks"><option value="">扫描中，也可以手动输入</option></select></label><button type="button" class="secondary" id="scan">重新扫描</button><label>Wi-Fi 名称<input id="ssid" maxlength="32" autocomplete="off" required placeholder="2.4 GHz 路由器或手机热点"></label><label>Wi-Fi 密码<input id="password" type="password" maxlength="63" autocomplete="new-password" placeholder="开放网络可留空"></label><label>管理服务地址<input id="server" type="url" maxlength="180" required placeholder="http://192.168.1.10:8787"></label><small>填写电脑的局域网地址，不能使用 localhost。电脑和设备需要处于可互通的网络。</small><button id="save">保存并连接 →</button></form><p id="status" role="status">正在读取设备状态…</p><div id="claim" hidden><small>设备号</small><code id="deviceId"></code><small>一次性认领码（15 分钟有效）</small><code id="claimCode"></code><p class="muted">在管理网站登录后输入设备号和认领码，即可将设备添加到自己的工作空间。</p></div></div><p class="muted">保存后设备会重启。若手机没有自动弹出此页，请手动访问 http://192.168.4.1 。长按设备 BOOT 键 5 秒可重新开启配网热点。</p>
<script>
const $=s=>document.querySelector(s);async function api(path,data){const r=await fetch(path,{method:data?'POST':'GET',headers:data?{'Content-Type':'application/json','X-Card-Setup':'1'}:{},body:data?JSON.stringify(data):undefined});const body=await r.json();if(!r.ok)throw new Error(body.error||'请求失败');return body;}
async function status(){try{const s=await api('/api/status');$('#status').textContent=s.message;$('#deviceId').textContent=s.device_id;$('#claimCode').textContent=s.claimed?'设备已认领':s.claim_code||'连接管理服务后显示';$('#claim').hidden=!s.device_id;if(s.ssid&&!$('#ssid').value)$('#ssid').value=s.ssid;if(s.server&&!$('#server').value)$('#server').value=s.server;}catch{$('#status').textContent='请确认手机仍连接设备的 Card 热点。';}}
async function scan(){const b=$('#scan');b.disabled=true;try{const s=await api('/api/scan');$('#networks').replaceChildren(new Option('选择 Wi-Fi，或在下面手动输入',''));for(const item of s.networks)$('#networks').append(new Option(item.ssid+'  ('+item.rssi+' dBm)',item.ssid));}catch(error){$('#status').textContent=error.message;}finally{b.disabled=false;}}
$('#networks').onchange=()=>{$('#ssid').value=$('#networks').value;};$('#scan').onclick=scan;$('#setup').onsubmit=async e=>{e.preventDefault();$('#save').disabled=true;try{const s=await api('/api/config',{ssid:$('#ssid').value,password:$('#password').value,server:$('#server').value});$('#status').textContent=s.message;}catch(error){$('#status').textContent=error.message;$('#save').disabled=false;}};status();scan();setInterval(status,5000);
</script></body></html>
